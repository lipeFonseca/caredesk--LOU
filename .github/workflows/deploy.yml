name: Deploy CareDesk

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
    && format(
      'manual publish ({0}) by {1}{2}',
      github.event.inputs.target || 'all',
      github.actor,
      github.event.inputs.reason && format(' - {0}', github.event.inputs.reason) || ''
    )
    || format('{0}', github.event.head_commit.message)
  }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Escopo da publicacao
        required: true
        default: all
        type: choice
        options:
          - all
          - worker
          - frontend
      reason:
        description: Motivo curto para a publicacao manual
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Deploy Scope
    runs-on: ubuntu-latest
    outputs:
      deploy_worker: ${{ steps.scope.outputs.deploy_worker }}
      deploy_frontend: ${{ steps.scope.outputs.deploy_frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve deploy scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          deploy_worker=false
          deploy_frontend=false

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            target="${{ github.event.inputs.target }}"
            case "$target" in
              all)
                deploy_worker=true
                deploy_frontend=true
                ;;
              worker)
                deploy_worker=true
                ;;
              frontend)
                deploy_frontend=true
                ;;
            esac
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"

            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              deploy_worker=true
              deploy_frontend=true
            else
              changed_files="$(git diff --name-only "$before" "$after")"

              while IFS= read -r file; do
                [[ -z "$file" ]] && continue

                case "$file" in
                  worker/*)
                    deploy_worker=true
                    ;;
                  frontend/*)
                    deploy_frontend=true
                    ;;
                esac
              done <<< "$changed_files"
            fi
          fi

          echo "deploy_worker=$deploy_worker" >> "$GITHUB_OUTPUT"
          echo "deploy_frontend=$deploy_frontend" >> "$GITHUB_OUTPUT"

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy_worker == 'true'

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Validate Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Secret CLOUDFLARE_API_TOKEN nao configurado"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Secret CLOUDFLARE_ACCOUNT_ID nao configurado"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs:
      - changes
      - deploy-worker
    if: >-
      needs.changes.outputs.deploy_frontend == 'true'
      && (needs['deploy-worker'].result == 'success' || needs['deploy-worker'].result == 'skipped')

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Install Wrangler CLI
        run: npm install --global wrangler@4

      - name: Validate Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Secret CLOUDFLARE_API_TOKEN nao configurado"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Secret CLOUDFLARE_ACCOUNT_ID nao configurado"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE_PRODUCTION }}

      - name: Deploy frontend to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name caredesk-lou
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs:
      - changes
      - deploy-worker
      - deploy-frontend
    if: always()

    steps:
      - name: Report deploy scope
        shell: bash
        run: |
          echo "Worker requested:   ${{ needs.changes.outputs.deploy_worker }}"
          echo "Frontend requested: ${{ needs.changes.outputs.deploy_frontend }}"
          echo "Worker result:      ${{ needs['deploy-worker'].result }}"
          echo "Frontend result:    ${{ needs['deploy-frontend'].result }}"
